<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Monthly Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBE5D3; --card:#F4EFE0; --ink:#1F3A33; --muted:#6C7A72; --brass:#9A7424; --rule:#C9C0A6; --red:#8A2F2F; --on-ink:#F4EFE0;
  --serif:"Bodoni Moda","Didot",Georgia,serif; --mono:"Courier Prime","Courier New",monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#14261F; --card:#1B3229; --ink:#EDE6D0; --muted:#97A59C; --brass:#C9A24D; --rule:#35504A; --red:#D98A80; --on-ink:#14261F; color-scheme:dark;}
}
:root[data-theme="dark"]{--paper:#14261F; --card:#1B3229; --ink:#EDE6D0; --muted:#97A59C; --brass:#C9A24D; --rule:#35504A; --red:#D98A80; --on-ink:#14261F; color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 18px 56px}
h1{font-family:var(--serif);font-weight:700;font-size:2rem;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:2px 0 22px;font-size:.9rem}
.nav{display:flex;align-items:center;justify-content:space-between;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:8px 0;margin-bottom:22px}
.nav .m{font-family:var(--serif);font-size:1.25rem;font-weight:500}
button{font:inherit;cursor:pointer;color:var(--ink);background:none;border:1px solid var(--ink);padding:8px 14px;border-radius:0}
button:hover{background:var(--ink);color:var(--on-ink)}
button.solid{background:var(--ink);color:var(--on-ink)}
button.solid:hover{background:var(--brass);border-color:var(--brass);color:#fff}
button.ghost{border:none;padding:4px 8px;color:var(--muted)}
button.ghost:hover{background:none;color:var(--red)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.balance{text-align:center;padding:26px 12px 22px;background:var(--card);border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:4px}
.balance .lbl{color:var(--muted);font-size:.9rem}
.balance .amt{font-family:var(--serif);font-size:clamp(2.4rem,11vw,3.6rem);font-weight:700;line-height:1.1;margin:4px 0 14px}
.balance .amt.neg{color:var(--red)}
.bar{height:8px;border:1px solid var(--ink);margin:0 8px;background:transparent}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}
.bar i.over{background:var(--red)}
.stats{display:flex;justify-content:space-between;margin:10px 8px 0;font-size:.85rem;color:var(--muted)}
form{margin-top:30px;display:grid;gap:10px}
label{font-size:.85rem;color:var(--muted)}
input{font:inherit;width:100%;padding:10px 12px;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:0}
input:focus{outline:2px solid var(--brass);border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin:34px 0 6px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px dotted var(--muted)}
li .note{font-weight:700;overflow-wrap:anywhere}
li .note.none{font-weight:400;color:var(--muted)}
li .date{color:var(--muted);font-size:.8rem}
li .amt{text-align:right;font-weight:700}
li .bal{text-align:right;color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);padding:18px 0;border-bottom:1px dotted var(--muted)}
.setup{margin-top:10px;padding:22px;background:var(--card);border:1px solid var(--ink);outline:1px solid var(--ink);outline-offset:4px}
.setup p{margin:0 0 14px}
.foot{display:flex;gap:10px;justify-content:space-between;margin-top:26px;font-size:.85rem}
.foot button{font-size:.85rem;padding:6px 10px}
.err{color:var(--red);font-size:.85rem;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#pf{margin-top:6px;padding:4px 14px;font-size:.85rem;white-space:nowrap}
.mrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:none;border-bottom:1px dotted var(--muted);padding:13px 4px}
.mrow:hover{background:var(--card);color:var(--ink)}
.sum{border:1px solid var(--ink);background:var(--card);padding:12px 16px;margin:10px 0 4px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
#bk,#dl{font-size:.85rem;padding:6px 10px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main>
  <header class="top"><h1>The Monthly Ledger</h1><button id="pf" type="button">Profile</button></header>
  <p class="sub">Set a budget. Cross off every spend.</p>
  <div class="nav">
    <button class="ghost" id="prev" aria-label="Previous month">&lsaquo; Prev</button>
    <span class="m" id="month"></span>
    <button class="ghost" id="next" aria-label="Next month">Next &rsaquo;</button>
  </div>
  <div id="view"></div>
</main>
<script>
(function(){
  // ====== PASTE YOUR FIREBASE CONFIG HERE ======
  var firebaseConfig={apiKey:"AIzaSyAGNp0Go4JlW3epz2sNh3dntvEUwfv8DSI",authDomain:"my-ledger-c8fc5.firebaseapp.com",projectId:"my-ledger-c8fc5",appId:"1:710243754814:web:2042b6f931a864d03b026f"};
  // ==============================================
  var cloud=!!window.firebase && firebaseConfig.apiKey.indexOf("PASTE")!==0;
  var KEY="monthly-ledger-v1", mem={months:{}}, db=null, auth=null, uid=null, userName="", state={months:{}};
  var screen="ledger", stmtKey=null;
  function showUser(){$("pf").style.display=(cloud&&!uid)?"none":""}
  function col(){return db.collection("users").doc(uid).collection("months")}
  function fail(e){alert("Could not sync: "+(e&&e.message||e))}
  function save(k){if(cloud){col().doc(k).set(state.months[k]).catch(fail)}else{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){mem=state}}}
  function remove(k){if(cloud){col().doc(k).delete().catch(fail)}else save(k)}
  if(!cloud){try{var r=localStorage.getItem(KEY);if(r)state=JSON.parse(r)}catch(e){}if(!state||!state.months)state={months:{}}}
  function authView(){
    $("view").innerHTML='<div class="setup"><p>Sign in to sync your ledger across all your devices.</p><form id="af"><label for="nm">Name (needed when creating an account)</label><input id="nm" type="text" autocomplete="name" maxlength="40"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required><label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password" minlength="6" required><div class="err" id="er"></div><button class="solid" type="submit">Sign in</button><button type="button" id="su">Create account</button></form></div>';
    var go=function(create){var nm=$("nm").value.trim(),e=$("em").value.trim(),p=$("pw").value;
      if(create&&!nm){$("er").textContent="Enter your name to create an account.";return}
      if(!e||p.length<6){$("er").textContent="Enter an email and a password of 6+ characters.";return}
      var fail=function(x){$("er").textContent=String(x.message).replace("Firebase: ","")};
      if(create){auth.createUserWithEmailAndPassword(e,p).then(function(c){userName=nm;showUser();return c.user.updateProfile({displayName:nm})}).catch(fail)}
      else auth.signInWithEmailAndPassword(e,p).catch(fail)};
    $("af").onsubmit=function(ev){ev.preventDefault();go(false)};
    $("su").onclick=function(){go(true)};
  }
  var now=new Date(), cur=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  var fmt=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2});
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function label(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
  function shift(k,d){var p=k.split("-"),dt=new Date(+p[0],+p[1]-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")}

  function spentOf(m){return m.tx.reduce(function(a,t){return a+t.amount},0)}
  function txList(m){
    var run=m.budget, rows=m.tx.map(function(t){run-=t.amount;return{t:t,r:run}}).reverse();
    if(!rows.length)return '<div class="empty">No transactions this month.</div>';
    return '<ul>'+rows.map(function(o){
      var d=new Date(o.t.date).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      return '<li><span class="note'+(o.t.note?'':' none')+'">'+(o.t.note?esc(o.t.note):'No note')+'</span><span class="amt">−'+fmt.format(o.t.amount)+'</span><span class="date">'+d+'</span><span class="bal">left '+fmt.format(o.r)+'</span></li>';
    }).join("")+'</ul>';
  }
  function money(n){return "Rs. "+n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function clean(t){return String(t).replace(/[^\x20-\x7E\u00A0-\u00FF]/g,"?")}
  function makePdf(k){
    var m=state.months[k];
    if(!m||!window.jspdf){alert("The PDF tool could not load. Check your connection and try again.");return}
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), W=210, H=297, M=18;
    var C={paper:[235,229,211],card:[244,239,224],ink:[31,58,51],brass:[154,116,36],muted:[108,122,114],red:[138,47,47]};
    var txt=function(c){doc.setTextColor(c[0],c[1],c[2])}, draw=function(c){doc.setDrawColor(c[0],c[1],c[2])}, fill=function(c){doc.setFillColor(c[0],c[1],c[2])};
    var sp=spentOf(m), left=m.budget-sp, y;
    function page(){
      fill(C.paper);doc.rect(0,0,W,H,"F");
      doc.setFont("times","bold");doc.setFontSize(26);txt(C.ink);doc.text("The Monthly Ledger",M,28);
      doc.setFont("courier","normal");doc.setFontSize(10);txt(C.muted);doc.text("Statement for "+clean(label(k)),M,35);
      var who=(cloud&&userName)?clean(userName):"";
      if(who)doc.text(who,W-M,28,{align:"right"});
      doc.text("Generated "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),W-M,35,{align:"right"});
      draw(C.ink);doc.setLineWidth(0.8);doc.line(M,41,W-M,41);doc.setLineWidth(0.25);doc.line(M,42.6,W-M,42.6);
    }
    function head(){
      doc.setFont("courier","bold");doc.setFontSize(8.5);txt(C.muted);
      doc.text("DATE",M,y);doc.text("NOTE",M+34,y);doc.text("AMOUNT",W-M-36,y,{align:"right"});doc.text("BALANCE",W-M,y,{align:"right"});
      draw(C.ink);doc.setLineWidth(0.4);doc.line(M,y+2.5,W-M,y+2.5);y+=8;
    }
    page();
    // summary card
    y=52;var h=26,cw=(W-2*M)/3;
    draw(C.ink);doc.setLineWidth(0.25);doc.rect(M-1.4,y-1.4,W-2*M+2.8,h+2.8);
    fill(C.card);doc.setLineWidth(0.4);doc.rect(M,y,W-2*M,h,"FD");
    [["BUDGET",money(m.budget),C.ink],["SPENT",money(sp),C.ink],[left<0?"OVERSPENT":"LEFT",money(Math.abs(left)),left<0?C.red:C.ink]].forEach(function(c,i){
      var x=M+6+i*cw;
      doc.setFont("courier","normal");doc.setFontSize(8.5);txt(C.muted);doc.text(c[0],x,y+9);
      doc.setFont("times","bold");doc.setFontSize(15);txt(c[2]);doc.text(c[1],x,y+19);
    });
    // transactions
    y=98;doc.setFont("times","bold");doc.setFontSize(17);txt(C.ink);doc.text("Transactions",M,y);y+=9;
    head();
    var run=m.budget;
    if(!m.tx.length){doc.setFont("courier","normal");doc.setFontSize(10);txt(C.muted);doc.text("No transactions this month.",M,y)}
    m.tx.forEach(function(t){
      run-=t.amount;
      var lines=doc.splitTextToSize(t.note?clean(t.note):"No note",70), rh=lines.length*4.6+4.4;
      if(y+rh>H-24){doc.addPage();page();y=56;head()}
      var d=new Date(t.date).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      doc.setFont("courier","normal");doc.setFontSize(8.5);txt(C.muted);doc.text(clean(d),M,y);
      doc.setFont("courier",t.note?"bold":"normal");doc.setFontSize(9.5);txt(t.note?C.ink:C.muted);doc.text(lines,M+34,y);
      doc.setFont("courier","bold");txt(C.ink);doc.text("-"+money(t.amount),W-M-36,y,{align:"right"});
      doc.setFont("courier","normal");txt(run<0?C.red:C.muted);doc.text(money(run),W-M,y,{align:"right"});
      draw(C.muted);doc.setLineWidth(0.2);doc.setLineDashPattern([0.4,1],0);doc.line(M,y+(lines.length-1)*4.6+2.5,W-M,y+(lines.length-1)*4.6+2.5);doc.setLineDashPattern([],0);
      y+=rh;
    });
    if(m.tx.length){
      if(y>H-30){doc.addPage();page();y=56}
      y+=3;draw(C.ink);doc.setLineWidth(0.25);doc.line(M,y,W-M,y);doc.setLineWidth(0.8);doc.line(M,y+1.6,W-M,y+1.6);
      doc.setFont("times","bold");doc.setFontSize(12);txt(C.ink);doc.text("Total spent",M,y+9);doc.text(money(sp),W-M,y+9,{align:"right"});
    }
    var n=doc.getNumberOfPages();
    for(var i=1;i<=n;i++){
      doc.setPage(i);draw(C.brass);doc.setLineWidth(0.3);doc.line(M,H-15,W-M,H-15);
      doc.setFont("courier","normal");doc.setFontSize(8);txt(C.muted);
      doc.text("The Monthly Ledger",M,H-10);doc.text("Page "+i+" of "+n,W-M,H-10,{align:"right"});
    }
    doc.save("ledger-"+k+".pdf");
  }
  function profileView(){
    var v=$("view"), real=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    var keys=Object.keys(state.months).filter(function(k){return k<=real}).sort().reverse();
    var rows=keys.map(function(k){return '<button class="mrow" data-m="'+k+'"><span>'+label(k)+(k===real?' (this month)':'')+'</span><span>'+fmt.format(spentOf(state.months[k]))+' spent</span></button>'}).join("");
    var nameBox=(cloud&&auth.currentUser)?'<h2>Your name</h2><form id="nf"><label for="pn">Name</label><input id="pn" type="text" maxlength="40" value="'+esc(userName)+'"><div class="err" id="nmsg"></div><button class="solid" type="submit">Save name</button></form><p class="sub">Signed in as '+esc(auth.currentUser.email||"")+'</p>':'';
    v.innerHTML=nameBox+'<h2>Past months</h2>'+(rows?'<div style="border-top:1px solid var(--ink)">'+rows+'</div>':'<div class="empty">Months you have budgeted will be listed here, with the total spent.</div>')+(cloud?'<div class="foot"><button id="so">Sign out</button></div>':'');
    v.onclick=function(e){var b=e.target.closest&&e.target.closest("[data-m]");if(b){stmtKey=b.getAttribute("data-m");screen="stmt";render()}};
    if($("nf"))$("nf").onsubmit=function(e){e.preventDefault();var n=$("pn").value.trim(),msg=$("nmsg");
      if(!n){msg.style.color="";msg.textContent="Name can’t be empty.";return}
      auth.currentUser.updateProfile({displayName:n}).then(function(){userName=n;msg.style.color="var(--brass)";msg.textContent="Name saved."}).catch(fail)};
    if($("so"))$("so").onclick=function(){screen="ledger";auth.signOut()};
  }
  function stmtView(){
    var m=state.months[stmtKey];
    if(!m){screen="profile";render();return}
    var sp=spentOf(m), left=m.budget-sp, v=$("view");
    v.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><button id="bk" type="button">&lsaquo; Back to profile</button><button id="dl" class="solid" type="button">Download PDF</button></div><h2>'+label(stmtKey)+'</h2><div class="sum"><div><span>Budget</span><span>'+fmt.format(m.budget)+'</span></div><div><span>Spent</span><span>'+fmt.format(sp)+'</span></div><div><span>'+(left<0?'Overspent':'Left')+'</span><span'+(left<0?' style="color:var(--red)"':'')+'>'+fmt.format(Math.abs(left))+'</span></div></div><h2>Statement</h2>'+txList(m);
    v.onclick=null;
    $("bk").onclick=function(){screen="profile";render()};
    $("dl").onclick=function(){makePdf(stmtKey)};
  }
  function render(){
    document.querySelector(".nav").style.display=(screen!=="ledger"||(cloud&&!uid))?"none":"";
    if(cloud&&!uid){authView();return}
    showUser();
    $("pf").textContent=screen==="ledger"?"Profile":"Ledger";
    if(screen==="profile"){profileView();return}
    if(screen==="stmt"){stmtView();return}
    $("month").textContent=label(cur);
    var m=state.months[cur], v=$("view");
    if(!m){
      v.innerHTML='<div class="setup"><p>No budget set for '+label(cur)+'. How much will you spend this month?</p>'+
        '<form id="bf"><label for="b">Monthly budget (₹)</label><input id="b" type="number" min="1" step="any" inputmode="decimal" required placeholder="e.g. 30000">'+
        '<button class="solid" type="submit">Start the month</button></form></div>';
      $("bf").onsubmit=function(e){e.preventDefault();var b=parseFloat($("b").value);if(!(b>0))return;state.months[cur]={budget:b,tx:[]};save(cur);render()};
      return;
    }
    var spent=m.tx.reduce(function(a,t){return a+t.amount},0), left=m.budget-spent, pct=Math.min(100,spent/m.budget*100);
    var run=m.budget, rows=m.tx.map(function(t){run-=t.amount;return{t:t,r:run}}).reverse();
    var list=rows.length?rows.map(function(o){
      var d=new Date(o.t.date).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      return '<li><span class="note'+(o.t.note?'':' none')+'">'+(o.t.note?esc(o.t.note):'No note')+'</span><span class="amt">−'+fmt.format(o.t.amount)+'</span>'+
        '<span class="date">'+d+' <button class="ghost" data-del="'+o.t.id+'" aria-label="Delete transaction">remove</button></span><span class="bal">left '+fmt.format(o.r)+'</span></li>';
    }).join(""):'<div class="empty">Nothing spent yet. Add your first transaction above.</div>';
    v.innerHTML='<section class="balance"><div class="lbl">Remaining</div><div class="amt'+(left<0?' neg':'')+'">'+fmt.format(left)+'</div>'+
      '<div class="bar"><i class="'+(left<0?'over':'')+'" style="width:'+pct+'%"></i></div>'+
      '<div class="stats"><span>Spent '+fmt.format(spent)+'</span><span>Budget '+fmt.format(m.budget)+'</span></div></section>'+
      '<form id="tf"><div class="row"><div><label for="a">Amount (₹)</label><input id="a" type="number" min="0.01" step="any" inputmode="decimal" required placeholder="0.00"></div>'+
      '<div><label for="n">Note</label><input id="n" type="text" maxlength="120" placeholder="Groceries, auto fare…"></div></div>'+
      '<button class="solid" type="submit">Cut from budget</button></form>'+
      '<h2>Transactions</h2><ul id="ul" style="'+(rows.length?'':'border-top:1px solid var(--ink)')+'">'+(rows.length?list:'')+'</ul>'+(rows.length?'':list)+
      '<div class="foot"><button id="eb">Edit budget</button><button id="rs">Clear this month</button>'+'</div>';
    $("tf").onsubmit=function(e){e.preventDefault();var a=parseFloat($("a").value);if(!(a>0))return;
      m.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),amount:a,note:$("n").value.trim(),date:new Date().toISOString()});save(cur);render();$("a").focus()};
    v.onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-del");
      if(id){m.tx=m.tx.filter(function(t){return t.id!==id});save(cur);render()}};
    $("eb").onclick=function(){var x=prompt("New monthly budget (₹)",m.budget);var b=parseFloat(x);if(b>0){m.budget=b;save(cur);render()}};
    $("rs").onclick=function(){if(confirm("Delete the budget and all transactions for "+label(cur)+"?")){delete state.months[cur];remove(cur);render()}};
  }
  $("pf").onclick=function(){screen=screen==="ledger"?"profile":"ledger";render()};
  $("prev").onclick=function(){cur=shift(cur,-1);render()};
  $("next").onclick=function(){cur=shift(cur,1);render()};
  if(cloud){
    firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
    var unsub=null;$("view").innerHTML='<p class="sub">Loading…</p>';
    auth.onAuthStateChanged(function(u){
      if(unsub){unsub();unsub=null}
      if(!u){uid=null;state={months:{}};render();return}
      uid=u.uid;userName=u.displayName||(u.email||"").split("@")[0];showUser();
      unsub=col().onSnapshot(function(snap){
        if(snap.metadata.hasPendingWrites)return;
        state.months={};snap.forEach(function(d){state.months[d.id]=d.data()});render();
      },fail);
    });
  }else render();
})();
</script>
</body>
</html>
